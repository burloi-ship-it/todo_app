{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-1">Login</h2>
                    <p class="text-muted small">Enter your credentials to access your account</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="******************" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <a href="/forgot-password" class="text-decoration-none small">Forgot password?</a>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-semibold">
                            Connect
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        Not a user? <a href="/register" class="text-decoration-none fw-bold">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
