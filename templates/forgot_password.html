{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                        <i class="bi bi-envelope-exclamation fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Password</h3>
                    <p class="text-muted small">Enter the email address associated with your account to receive the reset link.</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                {% if message %}
                    <div class="alert alert-success d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-check-circle-fill"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endif %}

                <form action="/forgot-password" method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold small">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-semibold">
                            <i class="bi bi-send me-1"></i> Reset Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="/login" class="text-decoration-none small fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
