{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                        <i class="bi bi-key-fill fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1">New password</h3>
                    <p class="text-muted small">Insert new password.</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                <form action="/reset-password" method="POST">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Type the new password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Update Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="/login" class="text-decoration-none small fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
