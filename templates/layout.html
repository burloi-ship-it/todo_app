<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} - Post-A-Todo{% else %}Post-A-Todo{% endif %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">

    <script>
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- Brand & Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="{{ url_for('static', path='/images/logo.png') }}" 
                     alt="PostATodo Logo" 
                     class="navbar-logo">
                <span class="brand-text fw-bold">Post-A-Todo</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill fs-xs">v1.0</span>
            </a>

            <!-- Meniu Dreapta -->
            <div class="d-flex align-items-center gap-3">
                
                {% if user %}
                    <div class="d-flex align-items-center gap-2 text-white">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span class="small fw-semibold d-none d-sm-inline">{{ user.username }}</span>
                    </div>

                    <a href="/change-password" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-key"></i>
                        <span class="d-none d-sm-inline">Change password</span>
                    </a>
                    
                    <a href="/logout" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1">
                        <i class="bi bi-box-arrow-right"></i>
                        <span class="d-none d-sm-inline">Logout</span>
                    </a>
                {% else %}
                    <!-- Corectat: Butoanele de Login și Register complete -->
                    <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
                    <a href="/register" class="btn btn-primary btn-sm">Register</a>
                {% endif %}

                <div class="vr bg-secondary opacity-50 my-1" style="height: 20px;"></div>

                <button id="theme-toggle" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2" type="button" aria-label="Change theme">
                    <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
                </button>
            </div>

        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock content %}
    </main>

    <!-- FOOTER -->
    <footer class="app-footer border-top py-3 mt-auto bg-white">
        <div class="container d-flex justify-content-between align-items-center text-muted small">
            <div>
                <strong>Post-A-Todo</strong> &copy; 2026. All rights reserved.
            </div>
            <div class="d-flex gap-3 align-items-center">
                <span class="d-inline-flex align-items-center gap-1 text-success">
                    <i class="bi bi-circle-fill fs-xs"></i> Active System
                </span>
                <span>&bull;</span>
                <a href="/docs" target="_blank" class="text-decoration-none text-muted">
                    <i class="bi bi-code-slash"></i> API Docs
                </a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');

            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                if (themeIcon) {
                    themeIcon.classList.remove('bi-moon-stars-fill');
                    themeIcon.classList.add('bi-sun-fill');
                }
            }

            if (!themeToggleBtn) return;

            themeToggleBtn.addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark-mode');
                document.documentElement.classList.toggle('dark-mode', isDark);

                if (themeIcon) {
                    if (isDark) {
                        themeIcon.classList.remove('bi-moon-stars-fill');
                        themeIcon.classList.add('bi-sun-fill');
                    } else {
                        themeIcon.classList.remove('bi-sun-fill');
                        themeIcon.classList.add('bi-moon-stars-fill');
                    }
                }

                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
