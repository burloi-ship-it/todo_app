{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                        <i class="bi bi-shield-lock fs-4"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Change Password</h3>
                    <p class="text-muted small">Update Password</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                {% if message %}
                    <div class="alert alert-success d-flex align-items-center gap-2 py-2 small" role="alert">
                        <i class="bi bi-check-circle-fill"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endif %}

                <form action="/change-password" method="POST">
                    <div class="mb-3">
                        <label for="current_password" class="form-label fw-semibold small">Current Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Introdu parola actuală" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="new_password" class="form-label fw-semibold small">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Introdu parola nouă" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Update password
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-sm mt-1">
                            <i class="bi bi-arrow-left me-1"></i> Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
